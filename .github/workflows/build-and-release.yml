name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  # ------------------------------------------------------------------
  # JOB 1: ANDROID BUILD (APK)
  # ------------------------------------------------------------------
  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      # Restore Secrets
      - uses: timheuer/base64-to-file@v1.2
        with:
          fileName: 'google-services.json'
          fileDir: 'composeApp/'
          encodedString: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}

      - id: decode_keystore
        uses: timheuer/base64-to-file@v1.2
        with:
          fileName: 'release.jks'
          encodedString: ${{ secrets.SIGNING_KEY_STORE_BASE64 }}

      # Build
      - run: chmod +x gradlew

      - run: ./gradlew clean :composeApp:assembleDebug --no-configuration-cache

      - env:
          SIGNING_STORE_FILE: ${{ steps.decode_keystore.outputs.filePath }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew :composeApp:assembleRelease --no-configuration-cache


      # 👇 ADD THIS STEP: Upload Artifacts (Runs on EVERY push)
      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Android-APK
          path: |
            composeApp/build/outputs/apk/debug/*.apk
            composeApp/build/outputs/apk/release/*.apk


      # Upload to Release Page
      - uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            composeApp/build/outputs/apk/debug/*.apk
            composeApp/build/outputs/apk/release/*.apk
          token: ${{ secrets.GITHUB_TOKEN }}

  # ------------------------------------------------------------------
  # JOB 2: LINUX DESKTOP (DEB)
  # ------------------------------------------------------------------
  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      # Restore Secrets
      - uses: timheuer/base64-to-file@v1.2
        with:
          fileName: 'secrets.properties'
          fileDir: 'composeApp/src/jvmMain/resources/'
          encodedString: ${{ secrets.SECRETS_PROPERTIES_BASE64 }}

      - uses: timheuer/base64-to-file@v1.2
        with:
          fileName: 'service-account.json'
          fileDir: 'composeApp/src/jvmMain/resources/'
          encodedString: ${{ secrets.SERVICE_ACCOUNT_JSON_BASE64 }}

      # Build Linux (.deb)
      - run: chmod +x gradlew
      - run: ./gradlew :composeApp:packageDistributionForCurrentOS


      # 👇 ADD THIS
      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Linux-Deb
          path: composeApp/build/compose/binaries/main/deb/*.deb



  # ------------------------------------------------------------------
  # JOB 3: WINDOWS DESKTOP (MSI)
  # ------------------------------------------------------------------
  build-windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      # Restore Secrets
      - uses: timheuer/base64-to-file@v1.2
        with:
          fileName: 'secrets.properties'
          fileDir: 'composeApp/src/jvmMain/resources/'
          encodedString: ${{ secrets.SECRETS_PROPERTIES_BASE64 }}

      - uses: timheuer/base64-to-file@v1.2
        with:
          fileName: 'service-account.json'
          fileDir: 'composeApp/src/jvmMain/resources/'
          encodedString: ${{ secrets.SERVICE_ACCOUNT_JSON_BASE64 }}

      # Build Windows (.msi)
      - run: ./gradlew :composeApp:packageDistributionForCurrentOS

      # 👇 ADD THIS FOR WINDOWS
      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Windows-Msi
          path: composeApp/build/compose/binaries/main/msi/*.msi


      # 👇 CRITICAL FIX: Stop Gradle to prevent Cache Error
      - name: Stop Gradle Daemon
        run: ./gradlew --stop

  # ------------------------------------------------------------------
  # JOB 4: MACOS DESKTOP (DMG)
  # ------------------------------------------------------------------
  build-mac:
    name: Build Mac
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      # Restore Secrets
      - uses: timheuer/base64-to-file@v1.2
        with:
          fileName: 'secrets.properties'
          fileDir: 'composeApp/src/jvmMain/resources/'
          encodedString: ${{ secrets.SECRETS_PROPERTIES_BASE64 }}

      - uses: timheuer/base64-to-file@v1.2
        with:
          fileName: 'service-account.json'
          fileDir: 'composeApp/src/jvmMain/resources/'
          encodedString: ${{ secrets.SERVICE_ACCOUNT_JSON_BASE64 }}

      # Build Mac (.dmg)
      - run: chmod +x gradlew
      - run: ./gradlew :composeApp:packageDistributionForCurrentOS

      # 👇 ADD THIS FOR MAC
      - name: Upload Mac Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Mac-Dmg
          path: composeApp/build/compose/binaries/main/dmg/*.dmg




  # ==================================================================
  # JOB 5: PUBLISH RELEASE
  # ==================================================================
  # ... (The final release job) ...
  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build-android, build-linux, build-windows, build-mac]
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # The Android-APK folder now contains BOTH debug and release APKs
          # because we bundled them together in Step 1.
          files: |
            release-assets/Android-APK/**/*.apk
            release-assets/Linux-Deb/*.deb
            release-assets/Windows-Msi/*.msi
            release-assets/Mac-Dmg/*.dmg