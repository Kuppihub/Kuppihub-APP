name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      # 1. Restore Google Services JSON (Securely)
      - name: Decode Google Services
        uses: timheuer/base64-to-file@v1.2
        with:
          fileName: 'google-services.json'
          fileDir: 'composeApp/'
          encodedString: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Android Debug APK
        run: ./gradlew :composeApp:assembleDebug --stacktrace

      - name: Decode Keystore
        id: decode_keystore
        uses: timheuer/base64-to-file@v1.2
        with:
          fileName: 'release.jks'
          encodedString: ${{ secrets.SIGNING_KEY_STORE_BASE64 }}

      - name: Build Android Release APK
        env:
          SIGNING_STORE_FILE: ${{ steps.decode_keystore.outputs.filePath }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew :composeApp:assembleRelease --stacktrace

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Kuppihub-release-${{ github.ref_name }}
          path: composeApp/build/outputs/apk/release/*.apk
          retention-days: 90

      - name: Create Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            composeApp/build/outputs/apk/debug/*.apk
            composeApp/build/outputs/apk/release/*.apk
          token: ${{ secrets.GITHUB_TOKEN }}

  build-desktop:
    name: Build Desktop Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      # 3. Restore secrets.properties (Securely)
      - name: Decode Secrets Properties
        uses: timheuer/base64-to-file@v1.2
        with:
          fileName: 'secrets.properties'
          fileDir: 'composeApp/src/jvmMain/resources/'
          encodedString: ${{ secrets.SECRETS_PROPERTIES_BASE64 }}

      # 4. Restore service-account.json (Securely)
      - name: Decode Service Account
        uses: timheuer/base64-to-file@v1.2
        with:
          fileName: 'service-account.json'
          fileDir: 'composeApp/src/jvmMain/resources/'
          encodedString: ${{ secrets.SERVICE_ACCOUNT_JSON_BASE64 }}

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Desktop Application
        run: ./gradlew :composeApp:packageDistributionForCurrentOS --stacktrace

      - name: Upload Desktop Build
        uses: actions/upload-artifact@v4
        with:
          name: Kuppihub-desktop-${{ github.ref_name }}
          path: composeApp/build/compose/binaries/main/**/*
          retention-days: 90